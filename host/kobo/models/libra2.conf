# SPDX-License-Identifier: GPL-3.0-or-later
# Kobo Libra 2 (N418): Freescale i.MX6 SoloLite (single-core Cortex-A9, NEON),
# Linux 4.1.15, 512 MB RAM (495 MB usable), 1264x1680 300 ppi e-ink panel,
# Elan Touchscreen (MT protocol B, raw X=0..1680 Y=0..1264 -> swap X/Y),
# gpio-keys (193 upper, 194 lower, 116 power), ComfortLight PRO (mxc_msp430 + lm3630a).
MODEL_ID=libra2
SOC=imx6sll
CPU_CORE=cortex-a9
CPU_CORES=1
RAM_MB=512

# Memory & swap (no kernel LMK on stock 4.1.15; rely on zram + ActivityManager proc limit)
ZRAM_MB=256
SWAPFILE_MB=0
VM_SWAPPINESS=100
VM_MIN_FREE_KB=4096
PROC_LIMIT=4
MAX_STARTING_BG=2
HEAP_START=8m
HEAP_GROWTH=128m
HEAP_SIZE=192m

# App AOT compilation on single-core Cortex-A9
APP_COMPILE=auto
COMPILE_CHARGING_ONLY=1
COMPILE_BATT_MIN=40

# Display: 1264x1680 300 ppi i.MX6 SLL EPDC v2
LCD_DENSITY=300
KFB_ANIM_MODE=0
KFB_FLASH=8
KFB_SETTLE=50
KFB_DITHER=3
KFB_HWC=1
KFB_HZ=30

# Touch & physical keys
TOUCH_SWAP_XY=1
TOUCH_EDGE_PX=120
PAGE_KEYS=gpio-keys
PAGE_KEYS_MAP=volume
PAGE_KEYS_SWAP=0

# Frontlight (sysfs-driven via kobo.sh)
FL_COLD=mxc_msp430.0
FL_WARM=lm3630a_led
FL_MAX=100

# Full exit on return so /mnt/onboard has zero lingering loop/mounts for USB mass storage
RETURN_MODE=off
